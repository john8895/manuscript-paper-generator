<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小學生稿紙產生器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft JhengHei", sans-serif;
    background: #f5f5f0;
    color: #333;
    padding: 24px;
  }
  .container { max-width: 960px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 20px; font-size: 22px; letter-spacing: 2px; }

  .field-group {
    margin-bottom: 10px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .field-group label { font-size: 14px; color: #555; white-space: nowrap; }
  .field-group input[type="text"] {
    padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px;
  }
  .field-group input[type="date"] {
    padding: 5px 8px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px;
  }
  .field-group select {
    padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px;
  }
  .field-title { flex: 1; min-width: 160px; max-width: 300px; }
  .field-name  { width: 100px; }
  .field-class { width: 90px; }
  .field-seat  { width: 70px; }

  textarea {
    width: 100%; height: 160px;
    font-size: 16px; line-height: 1.7; padding: 14px;
    border: 2px solid #d0d0c8; border-radius: 8px;
    resize: vertical;
    font-family: "Songti SC", "Noto Serif TC", serif;
    background: #fefefe;
  }
  textarea:focus { border-color: #2e8b57; outline: none; }

  .info { margin: 8px 0; color: #888; font-size: 13px; }

  .buttons { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  button {
    padding: 10px 24px; border: none; border-radius: 6px;
    font-size: 15px; cursor: pointer; transition: background 0.2s;
    font-weight: 500;
  }
  .btn-export { background: #2e8b57; color: #fff; }
  .btn-export:hover { background: #246e45; }
  .btn-print { background: #555; color: #fff; }
  .btn-print:hover { background: #333; }

  .preview { margin-top: 20px; }
  .page-wrapper {
    margin-bottom: 24px;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    border-radius: 4px;
    overflow: hidden;
    display: inline-block;
    max-width: 100%;
  }
  .page-label {
    font-size: 12px; color: #aaa; padding: 6px 12px;
    background: #fafafa; border-bottom: 1px solid #eee;
  }
  canvas { display: block; width: 100%; height: auto; }

  /* ── 手機版 ── */
  @media (max-width: 600px) {
    body { padding: 12px; }
    h1 { font-size: 18px; margin-bottom: 14px; }
    .field-group { gap: 6px; }
    .field-group label { font-size: 13px; }
    .field-group input[type="text"],
    .field-group input[type="date"],
    .field-group select { font-size: 13px; padding: 5px 8px; }
    .field-title { max-width: none; flex-basis: 100%; }
    .field-name { flex: 1; min-width: 80px; }
    .field-class { flex: 1; min-width: 70px; }
    .field-seat { flex: 1; min-width: 50px; }
    textarea { height: 120px; font-size: 15px; padding: 10px; }
    button { padding: 10px 16px; font-size: 14px; flex: 1; }
  }

  @media print {
    body { background: #fff; padding: 0; margin: 0; }
    .no-print { display: none !important; }
    .container { max-width: none; margin: 0; padding: 0; }
    .preview { margin: 0; padding: 0; }
    .page-wrapper {
      box-shadow: none; border-radius: 0; margin: 0; padding: 0;
      page-break-after: always;
      page-break-inside: avoid;
      display: block;
    }
    .page-wrapper:last-child { page-break-after: auto; }
    .page-label { display: none; }
    canvas { display: block; width: 100%; height: auto; }
  }
</style>
</head>
<body>
<div class="container">
  <h1 class="no-print">小學生稿紙產生器</h1>

  <div class="no-print">
    <!-- 第一行：標題 + 格式設定 -->
    <div class="field-group">
      <label>標題：</label>
      <input type="text" id="titleInput" class="field-title" placeholder="選填，例：我的寒假生活">
      <label>格子：</label>
      <select id="gridSize">
        <option value="large">大格 (低年級)</option>
        <option value="medium">中格 (中年級)</option>
        <option value="standard" selected>標準 (高年級)</option>
      </select>
    </div>

    <!-- 第二行：學生資訊 -->
    <div class="field-group">
      <label>姓名：</label>
      <input type="text" id="nameInput" class="field-name" placeholder="選填">
      <label>班級：</label>
      <input type="text" id="classInput" class="field-class" placeholder="選填">
      <label>座號：</label>
      <input type="text" id="seatInput" class="field-seat" placeholder="選填">
      <label>日期：</label>
      <input type="date" id="dateInput">
    </div>

    <!-- 第三行：方向 + 格線 + 字體 -->
    <div class="field-group">
      <label>方向：</label>
      <select id="orientation">
        <option value="portrait">直式</option>
        <option value="landscape">橫式</option>
      </select>
      <label>格線：</label>
      <select id="gridColor">
        <option value="#2e8b57">綠色</option>
        <option value="#b5453a">紅色</option>
        <option value="#999">灰色</option>
        <option value="#5b7daa">藍色</option>
      </select>
      <label>字體：</label>
      <select id="fontSelect">
        <option value="songti">宋體</option>
        <option value="kaiti">楷體</option>
      </select>
    </div>

    <textarea id="textInput" placeholder="在此貼上文章內容…"></textarea>
    <div class="info" id="info">共 0 字 / 0 頁</div>

    <div class="buttons">
      <button class="btn-export" onclick="exportAll()">匯出 PNG</button>
      <button class="btn-print" onclick="printPages()">列印</button>
    </div>
  </div>

  <div class="preview" id="preview"></div>

  <footer class="no-print" style="text-align:center; margin-top:40px; padding:16px 0; color:#bbb; font-size:13px;">
    <a href="https://github.com/john8895/manuscript-paper-generator" target="_blank" style="color:#999; text-decoration:none; display:inline-flex; align-items:center; gap:6px;"><svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>john8895/manuscript-paper-generator</a>
  </footer>
</div>

<script>
// ── 版面參數 ──
const A4_SHORT = 1654; // 200 DPI
const A4_LONG  = 2339;
const SIDE_MARGIN = 160;
const MIN_ROWS = 3;

const GRID_PRESETS = {
  large:    { cols: 12, label: '大格' },
  medium:   { cols: 15, label: '中格' },
  standard: { cols: 20, label: '標準' },
};

// ── DOM ──
const textInput     = document.getElementById('textInput');
const titleInput    = document.getElementById('titleInput');
const nameInput     = document.getElementById('nameInput');
const classInput    = document.getElementById('classInput');
const seatInput     = document.getElementById('seatInput');
const dateInput     = document.getElementById('dateInput');
const gridSizeSel   = document.getElementById('gridSize');
const gridColorSel  = document.getElementById('gridColor');
const fontSel       = document.getElementById('fontSelect');
const orientSel     = document.getElementById('orientation');
const preview       = document.getElementById('preview');
const infoEl        = document.getElementById('info');

// ── 字體 ──
function fontStack(key) {
  if (key === 'kaiti') return '"Kaiti SC", "DFKai-SB", "AR PL UKai TW", "Noto Sans TC", serif';
  return '"Songti SC", "SimSun", "Noto Serif TC", serif';
}

// ── 禁則字元 ──
const NO_START = new Set('。，、；：！？）」』】》〉．‧…─—～·｝)].,:;!?\'\"');

// ── 版面計算 ──
function getLayout() {
  const orient = orientSel.value;
  const isPortrait = orient === 'portrait';
  const canvasW = isPortrait ? A4_SHORT : A4_LONG;
  const canvasH = isPortrait ? A4_LONG  : A4_SHORT;
  const preset = GRID_PRESETS[gridSizeSel.value] || GRID_PRESETS.standard;
  const cols = preset.cols;

  const availW = canvasW - SIDE_MARGIN * 2;
  const cell = Math.floor(availW / cols);
  const gridW = cell * cols;
  const offsetX = Math.floor((canvasW - gridW) / 2);
  const charSize = Math.round(cell * 0.68);

  const topMargin = 210;
  const bottomMargin = 100;
  const maxGridH = canvasH - topMargin - bottomMargin;
  const maxRows = Math.floor(maxGridH / cell);

  return { canvasW, canvasH, cols, cell, gridW, offsetX, topMargin, maxRows, charSize, orient };
}

// ── 分頁 ──
function paginate(text, maxRows, cols) {
  const lines = text.split('\n');
  const pages = [];
  let page = [];
  let row = 0, col = 0;
  let maxRowUsed = 0;

  function newPage() {
    page._rowCount = maxRowUsed + 1;
    pages.push(page);
    page = [];
    row = 0; col = 0;
    maxRowUsed = 0;
  }

  for (let li = 0; li < lines.length; li++) {
    const chars = [...lines[li]];
    for (let ci = 0; ci < chars.length; ci++) {
      if (row >= maxRows) newPage();
      const nextCh = ci + 1 < chars.length ? chars[ci + 1] : null;
      if (col === cols - 1 && nextCh && NO_START.has(nextCh)) {
        col = 0; row++;
        if (row >= maxRows) newPage();
      }
      page.push({ char: chars[ci], row, col });
      if (row > maxRowUsed) maxRowUsed = row;
      col++;
      if (col >= cols) { col = 0; row++; }
    }
    if (col > 0 || chars.length === 0) { row++; col = 0; }
  }

  if (page.length > 0 || pages.length === 0) {
    page._rowCount = page.length > 0 ? maxRowUsed + 1 : 0;
    pages.push(page);
  }
  return pages;
}

// ── 學生資訊 ──
function getStudentInfo() {
  const name  = nameInput.value.trim();
  const cls   = classInput.value.trim();
  const seat  = seatInput.value.trim();
  const date  = dateInput.value;
  const parts = [];
  if (name) parts.push('姓名：' + name);
  if (cls)  parts.push('班級：' + cls);
  if (seat) parts.push('座號：' + seat);
  if (date) {
    const d = new Date(date);
    parts.push(d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日');
  }
  return parts;
}

// ── 繪製 ──
function renderPage(canvas, chars, pageNum, totalPages, title, layout, rowCount) {
  const { canvasW, canvasH, cols, cell, gridW, offsetX, topMargin, charSize } = layout;
  const actualRows = Math.max(rowCount, MIN_ROWS);
  const gridH = cell * actualRows;

  canvas.width  = canvasW;
  canvas.height = canvasH;
  const ctx = canvas.getContext('2d');
  const gridColor = gridColorSel.value;
  const font = fontStack(fontSel.value);

  // 背景
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvasW, canvasH);

  // 標題
  if (title) {
    ctx.fillStyle = '#333';
    ctx.font = 'bold 52px ' + font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(title, canvasW / 2, 65);
  }

  // 學生資訊
  const infoParts = getStudentInfo();
  if (infoParts.length > 0) {
    ctx.fillStyle = '#555';
    ctx.font = '30px ' + font;
    ctx.textBaseline = 'middle';
    const infoY = title ? 135 : 80;
    const totalText = infoParts.join('    ');
    // 靠右對齊到格線右邊
    ctx.textAlign = 'right';
    ctx.fillText(totalText, offsetX + gridW, infoY);
  }

  // 頁碼
  if (totalPages > 1) {
    ctx.fillStyle = '#bbb';
    ctx.font = '26px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pageNum + ' / ' + totalPages, canvasW / 2, topMargin + gridH + 60);
  }

  // 外框
  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 3;
  ctx.strokeRect(offsetX, topMargin, gridW, gridH);

  // 內格線
  ctx.lineWidth = 1;
  ctx.strokeStyle = gridColor;
  ctx.globalAlpha = 0.45;
  for (let r = 1; r < actualRows; r++) {
    ctx.beginPath();
    ctx.moveTo(offsetX, topMargin + r * cell);
    ctx.lineTo(offsetX + gridW, topMargin + r * cell);
    ctx.stroke();
  }
  for (let c = 1; c < cols; c++) {
    ctx.beginPath();
    ctx.moveTo(offsetX + c * cell, topMargin);
    ctx.lineTo(offsetX + c * cell, topMargin + gridH);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 填字
  ctx.fillStyle = '#222';
  ctx.font = charSize + 'px ' + font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const { char, row, col } of chars) {
    const x = offsetX + col * cell + cell / 2;
    const y = topMargin + row * cell + cell / 2;
    ctx.fillText(char, x, y);
  }
}

// ── 主渲染 ──
function render() {
  const text  = textInput.value;
  const title = titleInput.value.trim();
  const charCount = [...text.replace(/\n/g, '')].length;
  const layout = getLayout();
  const pages = paginate(text, layout.maxRows, layout.cols);

  infoEl.textContent = '共 ' + charCount + ' 字 / ' + pages.length + ' 頁'
    + '（每行 ' + layout.cols + ' 格，每頁最多 ' + layout.maxRows + ' 行）';
  preview.innerHTML = '';
  updatePrintStyle(layout.orient);
  saveState();

  pages.forEach((chars, i) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'page-wrapper';
    if (pages.length > 1) {
      const label = document.createElement('div');
      label.className = 'page-label no-print';
      label.textContent = '第 ' + (i + 1) + ' 頁';
      wrapper.appendChild(label);
    }
    const canvas = document.createElement('canvas');
    renderPage(canvas, chars, i + 1, pages.length, title, layout, chars._rowCount || 0);
    wrapper.appendChild(canvas);
    preview.appendChild(wrapper);
  });
}

// ── 動態列印方向 ──
let printStyleEl = null;
function updatePrintStyle(orient) {
  if (!printStyleEl) {
    printStyleEl = document.createElement('style');
    document.head.appendChild(printStyleEl);
  }
  const size = orient === 'portrait' ? 'A4 portrait' : 'A4 landscape';
  printStyleEl.textContent = '@media print { @page { size: ' + size + '; margin: 0; } }';
}

// ── 列印 ──
function printPages() { render(); window.print(); }

// ── 匯出 ──
function exportAll() {
  const canvases = preview.querySelectorAll('canvas');
  if (!canvases.length) return;
  const base = titleInput.value.trim() || '稿紙';
  canvases.forEach((cv, i) => {
    setTimeout(() => {
      cv.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = canvases.length === 1
          ? base + '.png'
          : base + '_' + (i + 1) + '.png';
        a.click();
        URL.revokeObjectURL(a.href);
      }, 'image/png');
    }, i * 350);
  });
}

// ── localStorage ──
const STORAGE_KEY = 'manuscript-paper-state';

function saveState() {
  try {
    const state = {
      text: textInput.value,
      title: titleInput.value,
      name: nameInput.value,
      class: classInput.value,
      seat: seatInput.value,
      date: dateInput.value,
      gridSize: gridSizeSel.value,
      gridColor: gridColorSel.value,
      font: fontSel.value,
      orientation: orientSel.value,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* ignore */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.text != null)        textInput.value    = s.text;
    if (s.title != null)       titleInput.value   = s.title;
    if (s.name != null)        nameInput.value    = s.name;
    if (s.class != null)       classInput.value   = s.class;
    if (s.seat != null)        seatInput.value    = s.seat;
    if (s.date != null)        dateInput.value    = s.date;
    if (s.gridSize != null)    gridSizeSel.value  = s.gridSize;
    if (s.gridColor != null)   gridColorSel.value = s.gridColor;
    if (s.font != null)        fontSel.value      = s.font;
    if (s.orientation != null) orientSel.value    = s.orientation;
  } catch (e) { /* ignore */ }
}

// ── 事件 ──
let debounce;
function scheduleRender() { clearTimeout(debounce); debounce = setTimeout(render, 120); }

const allInputs = [textInput, titleInput, nameInput, classInput, seatInput, dateInput];
allInputs.forEach(el => el.addEventListener('input', scheduleRender));
[gridSizeSel, gridColorSel, fontSel, orientSel].forEach(el => el.addEventListener('change', render));

// ── 初始化 ──
loadState();
render();
</script>
</body>
</html>
